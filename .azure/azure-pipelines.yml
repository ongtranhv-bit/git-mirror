# Azure Pipelines worker — tương đương .github/workflows/git-mirror-worker.yml
#
# Khác biệt so với GitHub Actions:
#   - lockBehavior: sequential  → chỉ một run chạy tại một thời điểm (giống
#     concurrency group `git-mirror-worker-production` của GHA).
#   - Secret lấy từ pipeline variable group `git-mirror` (tạo trong Library,
#     đánh dấu Secret cho GOOGLE_SERVICE_ACCOUNT_B64 và RTDB_AUTH_SECRET).
#   - Node dùng task UseNode@1 (NodeTool@0 đã deprecated).
#
# Variable group `git-mirror` cần chứa:
#   RTDB_URL, GOOGLE_SERVICE_ACCOUNT_B64, RTDB_AUTH_SECRET

trigger:
  branches:
    include:
      - main

pr: none

schedules:
  - cron: "55 * * * *"
    displayName: Hourly worker
    branches:
      include:
        - main
    always: true

lockBehavior: sequential

pool:
  vmImage: ubuntu-latest

jobs:
  - job: worker
    displayName: Git Mirror Sync Worker
    timeoutInMinutes: 340
    cancelTimeoutInMinutes: 10
    variables:
      - group: git-mirror
    steps:
      - checkout: self

      - task: UseNode@1
        displayName: Install Node.js 22 (latest 22.x)
        inputs:
          version: "22.x"
          checkLatest: true

      - script: npm ci --ignore-scripts --include=dev
        displayName: Install dependencies (npm registry)

      - script: npm run build
        displayName: Build

      - bash: |
          set -euo pipefail
          minutes="${RUN_MINUTES:-300}"
          seconds=$(( minutes * 60 ))
          echo "Starting git-mirror worker (run --bridge) for ${minutes} minutes, then graceful SIGTERM."
          node dist/cli.js run --bridge &
          pid=$!
          forward() { kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; exit 0; }
          trap forward TERM INT
          sleep "$seconds" &
          sleeper=$!
          # Wait for whichever finishes first: the worker (handover/restart-required
          # exits early to release the lock) or the keep-alive window.
          wait -n "$pid" "$sleeper" || true
          kill "$sleeper" 2>/dev/null || true
          kill -TERM "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
        displayName: Run worker listener (keep-alive)
        env:
          RTDB_URL: $(RTDB_URL)
          GOOGLE_SERVICE_ACCOUNT_B64: $(GOOGLE_SERVICE_ACCOUNT_B64)
          RTDB_AUTH_SECRET: $(RTDB_AUTH_SECRET)
          NODE_ENV: production
          RUN_MINUTES: "300"
          RUNNER_WORKFLOW_FILE: azure-pipelines.yml
