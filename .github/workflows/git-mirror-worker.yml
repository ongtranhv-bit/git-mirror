name: Git Mirror Sync Worker

on:
  schedule:
    # Hourly at :07 UTC (off top-of-hour, which GitHub Actions drops under load).
    # The 55-minute worker ends ~:02, leaving a ~5 minute gap each hour.
    - cron: "55 * * * *"
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "Thời gian chạy listener liên tục (phút)"
        required: false
        default: "300"
        type: number

permissions:
  actions: write
  attestations: write
  checks: write
  contents: write
  deployments: write
  discussions: write
  id-token: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

concurrency:
  # Keep only one listener chain: the next run queues until the current one
  # finishes, so the worker keeps running with minimal gaps.
  group: git-mirror-worker-production
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    if: >-
      (github.event_name == 'workflow_dispatch')      
      || (github.event_name == 'push' && github.repository == 'ongtrieuhauphuchien29-oss/git-mirror')
      || (github.event_name == 'schedule' && github.repository == 'ongtrieuhauphuchien29-oss/git-mirror')
    env:
      RTDB_URL: ${{ secrets.RTDB_URL }}
      GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
      RTDB_AUTH_SECRET: ${{ secrets.RTDB_AUTH_SECRET }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Build
        run: npm run build
      - name: Run worker listener (keep-alive)
        shell: bash
        run: |
          set -euo pipefail
          minutes="${{ inputs.run_minutes || '300' }}"
          seconds=$(( minutes * 60 ))
          echo "Starting git-mirror worker (run --bridge) for ${minutes} minutes, then graceful SIGTERM."
          node dist/cli.js run --bridge &
          pid=$!
          forward() { kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; exit 0; }
          trap forward TERM INT
          sleep "$seconds"
          kill -TERM "$pid"
          wait "$pid"
